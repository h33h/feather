# Merge into existing approved nginx config; do not replace unrelated virtual hosts.
# http context:
limit_req_zone $binary_remote_addr zone=isign_auth:1m rate=10r/m;
server {
    listen 443 ssl;
    server_name isign.cloudnodex.ru;
    ssl_certificate /approved/tls/isign/fullchain.pem;
    ssl_certificate_key /approved/tls/isign/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1024m;
    # Capability paths contain bearer secrets: suppress URL logging.
    location ~ ^/(install|handoff)/ {
        access_log off;
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
    }
    # Broker authorization is internal; never expose it to the public listener.
    location ^~ /api/internal/ { return 404; }
    location ^~ /api/auth/ {
        limit_req zone=isign_auth burst=6 nodelay;
        client_max_body_size 16k;
        access_log off;
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/devices/callback {
        access_log off;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
# No alias or static /data route. Node streams recheck ownership/revocation throughout reads.
# Trusted broker uses a separate private HTTPS route to /api/internal/runner/authorize,
# bearer/HMAC authenticated and inaccessible through this public vhost.

# Private broker-to-web current-binding authorization. TLS hostname is the canonical
# origin, connection address is fixed loopback; the broker sends canonical Host.
server {
    listen 127.0.0.1:8444 ssl;
    server_name isign.cloudnodex.ru;
    ssl_certificate /etc/isign/tls/authorizer.pem;
    ssl_certificate_key /etc/isign/tls/authorizer.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16k;
    location = /api/internal/runner/authorize {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host isign.cloudnodex.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
