<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Нет подключения — iSign</title>
    <script>
      (function bootstrapTheme(config, apply) {
        apply(config);
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          if (document.documentElement.dataset.themePreference === 'system') {
            apply(config, 'system');
            window.dispatchEvent(new Event(config.changeEvent));
          }
        });
        window.addEventListener('storage', (event) => {
          if (event.key === null || event.key === config.storageKey) {
            apply(config);
            window.dispatchEvent(new Event(config.changeEvent));
          }
        });
      })(
        {
          storageKey: 'isign-theme',
          changeEvent: 'isign:theme-change',
          light: '#fff',
          dark: '#18181b',
        },
        function initializeTheme(config, chosen) {
          let preference = chosen ?? 'system';
          if (chosen === void 0) {
            try {
              const saved = localStorage.getItem(config.storageKey);
              if (saved === 'light' || saved === 'dark') preference = saved;
            } catch {}
          }
          const resolved =
            preference === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          const root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themePreference = preference;
          root.style.colorScheme = resolved;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = config[resolved];
          return preference;
        },
      );
    </script>
    <style>
      :root,
      .store {
        --color-action: #0759d9;
        --color-action-hover: #064bb6;
        --color-text: #19202b;
        --color-text-secondary: #5b6370;
        --color-surface: #fff;
        --color-surface-muted: #f3f5f8;
        --color-selected: #eef3fc;
        --color-rule: #e3e7ed;
        --color-field-border: #8590a0;
        --color-success: #187348;
        --color-error: #aa2531;
        --color-warning: #99590a;
        --color-warning-surface: #fff5de;
        --space-group: 8px;
        --space-control: 12px;
        --space-field: 16px;
        --space-section: 24px;
        --space-page-bottom: 48px;
        --space-screen: 32px;
        --control-height: 48px;
        --control-target: 44px;
        --control-radius: 12px;
        --text-body: 16px;
        --text-label: 14px;
        --text-caption: 12px;
        --line-body: 24px;
        --line-label: 20px;
        --line-caption: 18px;
        --color-action-active: #043c91;
        --color-secondary-hover: #e0eafa;
        --color-error-surface: #fff0f0;
        --color-error-hover: #8c1f2b;
        --space-tight: 4px;
        --radius-surface: 16px;
        --radius-sheet: 20px;
        --radius-chip: 8px;
        --text-title: 32px;
        --line-title: 38px;
        --text-section: 20px;
        --line-section: 26px;
        --font-medium: 600;
        --font-strong: 700;
        --color-on-action: #fff;
        --color-on-error: #fff;
        --color-action-fill: var(--color-action);
        --color-action-fill-hover: var(--color-action-hover);
        --color-action-fill-active: var(--color-action-active);
        --color-error-fill: var(--color-error);
        --color-error-fill-hover: var(--color-error-hover);
        --color-surface-raised: #fff;
        --color-card-hover: #f8faff;
        --color-success-surface: #ebfaf2;
        --color-selection: #d8e7ff;
        --color-selection-text: #102b53;
        --color-scrollbar: #8590a0;
        --color-backdrop: rgb(0 0 0 / 32%);
        --shadow-floating: 0 8px 28px rgb(25 32 43 / 12%);
        --theme-color-scheme: light;
      }
      :root[data-theme='dark'],
      :root[data-theme='dark'] .store {
        --color-action: #91b1eb;
        --color-action-hover: #aec6f0;
        --color-action-active: #7d9fdc;
        --color-action-fill: #3667be;
        --color-action-fill-hover: #4774c4;
        --color-action-fill-active: #315da8;
        --color-text: #e7e7ea;
        --color-text-secondary: #a2a2ac;
        --color-surface: #18181b;
        --color-surface-raised: #202023;
        --color-surface-muted: #28282c;
        --color-selected: #29292e;
        --color-secondary-hover: #333339;
        --color-card-hover: #242428;
        --color-rule: #36363c;
        --color-field-border: #73737d;
        --color-success: #8bc6a2;
        --color-success-surface: #243129;
        --color-error: #e99ca2;
        --color-error-surface: #362529;
        --color-error-hover: #efb0b5;
        --color-error-fill: #a3444e;
        --color-error-fill-hover: #b34c57;
        --color-warning: #d9bc82;
        --color-warning-surface: #332d21;
        --color-selection: #33445d;
        --color-selection-text: #f0f1f3;
        --color-scrollbar: #73737d;
        --color-backdrop: rgb(0 0 0 / 64%);
        --shadow-floating: 0 8px 28px rgb(0 0 0 / 28%);
        --theme-color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]),
        :root:not([data-theme]) .store {
          --color-action: #91b1eb;
          --color-action-hover: #aec6f0;
          --color-action-active: #7d9fdc;
          --color-action-fill: #3667be;
          --color-action-fill-hover: #4774c4;
          --color-action-fill-active: #315da8;
          --color-text: #e7e7ea;
          --color-text-secondary: #a2a2ac;
          --color-surface: #18181b;
          --color-surface-raised: #202023;
          --color-surface-muted: #28282c;
          --color-selected: #29292e;
          --color-secondary-hover: #333339;
          --color-card-hover: #242428;
          --color-rule: #36363c;
          --color-field-border: #73737d;
          --color-success: #8bc6a2;
          --color-success-surface: #243129;
          --color-error: #e99ca2;
          --color-error-surface: #362529;
          --color-error-hover: #efb0b5;
          --color-error-fill: #a3444e;
          --color-error-fill-hover: #b34c57;
          --color-warning: #d9bc82;
          --color-warning-surface: #332d21;
          --color-selection: #33445d;
          --color-selection-text: #f0f1f3;
          --color-scrollbar: #73737d;
          --color-backdrop: rgb(0 0 0 / 64%);
          --shadow-floating: 0 8px 28px rgb(0 0 0 / 28%);
          --theme-color-scheme: dark;
        }
      }
      @media (max-width: 900px) and (min-width: 701px) {
        .store {
          --space-screen: 24px;
        }
      }
      @media (max-width: 700px) {
        .store {
          --space-screen: 20px;
          --space-page-bottom: 32px;
        }
      }
      @media (max-width: 370px) {
        .store {
          --space-screen: 16px;
          --text-title: 28px;
          --line-title: 34px;
        }
      }

      body:has(.public-shell) {
        margin: 0;
        background: var(--color-surface);
      }
      .store.public-shell {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        background: var(--color-surface);
        color: var(--color-text);
        color-scheme: var(--theme-color-scheme);
        font:
          400 var(--text-body)/var(--line-body) -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      .public-shell *,
      .public-shell *::before,
      .public-shell *::after {
        box-sizing: border-box;
      }
      .public-shell ::selection {
        background: var(--color-selection);
        color: var(--color-selection-text);
      }
      .store.public-shell .public-header {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        height: calc(72px + env(safe-area-inset-top));
        margin: 0;
        padding: calc(14px + env(safe-area-inset-top)) var(--space-screen) 14px;
        border: 0;
      }
      .store.public-shell .public-brand {
        display: inline-flex;
        align-items: center;
        min-height: var(--control-target);
        color: var(--color-action);
        font-size: 24px;
        line-height: 30px;
        font-weight: var(--font-strong);
        text-decoration: none;
      }
      .store.public-shell .public-main {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        width: min(704px, 100%);
        max-width: none;
        margin: 0 auto;
        padding: var(--space-screen) var(--space-screen)
          calc(var(--space-page-bottom) + env(safe-area-inset-bottom));
      }
      .store.public-shell .public-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        align-items: center;
        justify-content: center;
        gap: var(--space-section);
        padding-block: var(--space-section);
        text-align: center;
      }
      .store.public-shell .public-title {
        margin: 0;
        color: var(--color-text);
        font-size: var(--text-title);
        line-height: var(--line-title);
        font-weight: var(--font-strong);
        letter-spacing: 0;
        overflow-wrap: anywhere;
        text-wrap: balance;
      }
      .store.public-shell .public-message,
      .store.public-shell .public-note {
        max-width: 72ch;
        margin: 0;
        color: var(--color-text-secondary);
        font-size: var(--text-body);
        line-height: var(--line-body);
        overflow-wrap: anywhere;
      }
      .store.public-shell .public-actions {
        display: grid;
        flex: none;
        gap: var(--space-field);
        width: 100%;
        padding-top: var(--space-section);
      }
      .store.public-shell .public-actions form {
        margin: 0;
      }
      .store.public-shell .public-note {
        font-size: var(--text-label);
        line-height: var(--line-label);
        text-align: center;
      }
      .store.public-shell .public-action {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: var(--control-height);
        margin: 0;
        padding: var(--space-control) var(--space-field);
        border: 0;
        border-radius: var(--control-radius);
        background: var(--color-action-fill);
        color: var(--color-on-action);
        font:
          var(--font-medium) var(--text-label)/var(--line-label) -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        text-align: center;
        text-decoration: none;
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .store.public-shell .public-action:hover {
        background: var(--color-action-fill-hover);
      }
      .store.public-shell .public-action.secondary {
        background: var(--color-selected);
        color: var(--color-action);
      }
      .store.public-shell .public-action.secondary:hover {
        background: var(--color-secondary-hover);
      }
      .public-shell :is(a, button):focus-visible {
        outline: 3px solid var(--color-action);
        outline-offset: 3px;
      }
      @media (max-width: 700px) {
        .store.public-shell .public-header {
          height: calc(64px + env(safe-area-inset-top));
          padding-block: calc(10px + env(safe-area-inset-top)) 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="store public-shell">
      <header class="public-header">
        <a class="public-brand" href="/" aria-label="iSign — на главную">iSign</a>
      </header>
      <main class="public-main">
        <div class="public-content">
          <h1 class="public-title">Нет подключения</h1>
          <p class="public-message">
            Подключитесь к Wi-Fi или мобильной сети, чтобы продолжить установку iSign Client.
          </p>
        </div>
        <div class="public-actions"><a class="public-action" href="/">Повторить</a></div>
      </main>
    </div>
  </body>
</html>
